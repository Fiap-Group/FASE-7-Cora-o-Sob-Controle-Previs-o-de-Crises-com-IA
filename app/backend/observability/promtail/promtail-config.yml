server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          service: backend
          __path__: /var/log/backend/app.log
    pipeline_stages:
      - json:
          expressions:
            nivel: nivel
            logger: logger
            evento: evento
            client: client
      - labels:
          nivel:
          logger:
          evento:
          client:
      - timestamp:
          source: ts
          format: "2006-01-02T15:04:05"
