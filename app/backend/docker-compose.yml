services:
  backend:
    build: .
    # Porta publicada só na interface local. O túnel (cloudflared/ngrok) acessa daqui.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
