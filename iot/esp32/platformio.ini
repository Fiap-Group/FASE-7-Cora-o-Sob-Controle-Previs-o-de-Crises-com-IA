; PlatformIO lê ${sysenv.*} do ambiente do shell, não direto do arquivo .env.
; Antes de compilar/simular, exporte o .env para o shell:
;   export $(grep -v '^#' .env | xargs) && pio run
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -D MQTT_SERVER='"${sysenv.MQTT_SERVER}"'
    -D MQTT_PORT=${sysenv.MQTT_PORT}
    -D MQTT_USER='"${sysenv.MQTT_USER}"'
    -D MQTT_PASSWORD='"${sysenv.MQTT_PASSWORD}"'
